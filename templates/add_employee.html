<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Employee</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }


    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .form-container {
      background-color: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }

    h2 {
      text-align: center;
      color: #4b4fcb;
      margin-bottom: 25px;
    }

    form label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #333;
    }

    form input {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #5a67d8;
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #434190;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #4b4fcb;
      font-weight: 500;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Add New Employee</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div style="background:#f0fff4; color:#2f855a; padding:10px 14px; border-radius:8px; margin-bottom:15px; font-size:14px;">
          {% for message in messages %}<div>{{ message }}</div>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <form method="POST" action="/employees/add" enctype="multipart/form-data">
      <label for="employee_id">Employee ID:</label>
      <input type="text" name="employee_id" id="employee_id" required />

      <label for="name">Name:</label>
      <input type="text" name="name" id="name" required />

      <label for="email">Email:</label>
      <input type="email" name="email" id="email" required />

      <label for="phone">Phone:</label>
      <input type="text" name="phone" id="phone" />

      <label for="department">Department:</label>
      <input type="text" name="department" id="department" />

      <label for="role">Role:</label>
      <input type="text" name="role" id="role" />

      <label for="date_of_joining">Date of Joining:</label>
      <input type="date" name="date_of_joining" id="date_of_joining" required />

      <label for="photo">Photo (clear, front-facing — used to register their face):</label>
      <input type="file" name="photo" id="photo" accept="image/*" />

      <button type="submit">Add Employee</button>
    </form>

    <a href="/employees" class="back-link">Back to Employee List</a>
  </div>
</body>
</html>
