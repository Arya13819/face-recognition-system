<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Face Recognition Attendance System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #4b4fcb;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            background-color: #5a67d8;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .login-btn:hover {
            background-color: #434190;
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
        }

        .back-link a {
            text-decoration: none;
            color: #4b4fcb;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
        .demo-divider {
            display: flex;
            align-items: center;
            margin: 22px 0 16px;
            color: #999;
            font-size: 13px;
        }

        .demo-divider::before,
        .demo-divider::after {
            content: '';
            flex: 1;
            border-top: 1px solid #e2e2e2;
        }

        .demo-divider span { padding: 0 12px; }

        .demo-btn {
            display: block;
            text-align: center;
            padding: 12px;
            border: 2px solid #4b4fcb;
            border-radius: 8px;
            color: #4b4fcb;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.25s;
        }

        .demo-btn:hover {
            background: #4b4fcb;
            color: #fff;
            transform: translateY(-1px);
        }

        .demo-note {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Face Recognition Attendance System</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div style="background:#fff5f5; color:#c53030; padding:10px 14px; border-radius:8px; margin-bottom:15px; font-size:14px;">
              {% for message in messages %}<div>{{ message }}</div>{% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="demo-divider"><span>or</span></div>
        <a href="/demo" class="demo-btn">&#128065;&#65039; View Live Demo &mdash; no login needed</a>
        <p class="demo-note">Read-only tour with realistic sample data</p>
        <div class="back-link">
            <a href="/">Back to Home</a>
        </div>
    </div>
</body>
</html>
