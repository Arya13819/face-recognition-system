<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Employee - AttendanceAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(to right, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      background: white;
      width: 220px;
      padding: 30px 20px;
      border-top-right-radius: 20px;
      border-bottom-right-radius: 20px;
      box-shadow: 4px 0 12px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar h2 {
      font-size: 20px;
      margin-bottom: 25px;
      color: #4b4fcb;
    }

    .sidebar a {
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 10px;
      color: #333;
      background-color: #f7f7f7;
      font-weight: 500;
      font-size: 14px;
      transition: background-color 0.2s ease;
    }

    .sidebar a:hover {
      background-color: #e0e7ff;
    }

    /* Main Content */
    .main-content {
      flex-grow: 1;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .header-bar h2 {
      color: #4b4fcb;
      font-size: 22px;
    }

    .dashboard-btn {
      background-color: #e2e8f0;
      color: #333;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .dashboard-btn:hover {
      background-color: #cbd5e0;
    }

    form label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      font-size: 14px;
    }

    form input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    form input[type="submit"] {
      margin-top: 25px;
      background-color: #5a67d8;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    form input[type="submit"]:hover {
      background-color: #434190;
    }

  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>AttendanceAI</h2>
    <a href="/dashboard">Overview</a>
    <a href="/employees">Employee Management</a>
    <a href="/attendance">Attendance</a>
    <a href="/face_recognition">face_Recognition</a>
    <a href="/leave_management">Leave Management</a>
    <a href="/reports">Reports</a>
    <a href="/settings">Settings</a>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    {% include "_flash.html" %}
    <div class="container">
      <div class="header-bar">
        <h2>Edit Employee</h2>
        <button class="dashboard-btn" onclick="window.location.href='/dashboard'">← Back to Dashboard</button>
      </div>

      <form method="POST" enctype="multipart/form-data">
        <label>Employee ID:</label>
        <input type="text" name="employee_id" value="{{ employee.employee_id }}" required>

        <label>Name:</label>
        <input type="text" name="name" value="{{ employee.name }}" required>

        <label>Email:</label>
        <input type="email" name="email" value="{{ employee.email }}" required>

        <label>Phone:</label>
        <input type="text" name="phone" value="{{ employee.phone }}" required>

        <label>Department:</label>
        <input type="text" name="department" value="{{ employee.department }}" required>

        <label>Role:</label>
        <input type="text" name="role" value="{{ employee.role }}" required>

        <label>Date of Joining:</label>
        <input type="date" name="date_of_joining" value="{{ employee.date_of_joining }}" required>

        <label>Update Photo (optional — re-registers face if changed):</label>
        <input type="file" name="photo" accept="image/*">

        <input type="submit" value="Update">
      </form>
    </div>
  </div>

</body>
</html>
